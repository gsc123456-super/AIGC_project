project: AIGC-Guard

model:
  name: rgb_fft_fusion
  rgb_backbone: convnext_tiny
  pretrained: true
  num_classes: 2
  fft_feature_dim: 128
  hidden_dim: 256
  dropout: 0.2

data:
  train_csv: data/genimage_subset/meta/train.csv
  val_csv: data/genimage_subset/meta/val.csv
  test_csv: data/genimage_subset/meta/test.csv
  input_size: 224
  max_train_samples: 3200
  max_val_samples: 1600
  max_test_samples: 1600

train:
  device: cuda
  epochs: 3
  batch_size: 8
  lr: 0.00005
  weight_decay: 0.0001
  num_workers: 2
  amp: true
  seed: 42

eval:
  device: cuda
  batch_size: 32
  num_workers: 2

output:
  ckpt_dir: results/checkpoints/rgb_fft_fusion_genimage_quick_final
  log_dir: results/logs/rgb_fft_fusion_genimage_quick_final
  table_dir: results/tables
