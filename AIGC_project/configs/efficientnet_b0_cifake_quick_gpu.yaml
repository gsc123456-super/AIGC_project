project: AIGC-Guard

model:
  name: efficientnet_b0
  pretrained: true
  num_classes: 2

data:
  train_dir: data/cifake/train
  test_dir: data/cifake/test
  input_size: 224
  val_ratio: 0.1
  max_train_samples: 10000
  max_val_samples: 2000
  max_test_samples: 5000

train:
  device: cuda
  epochs: 2
  batch_size: 32
  lr: 0.0001
  weight_decay: 0.0001
  num_workers: 2
  amp: true
  seed: 42

eval:
  device: cuda
  batch_size: 64
  num_workers: 2

output:
  ckpt_dir: results/checkpoints/efficientnet_b0_cifake_quick_gpu
  log_dir: results/logs/efficientnet_b0_cifake_quick_gpu
  table_dir: results/tables
